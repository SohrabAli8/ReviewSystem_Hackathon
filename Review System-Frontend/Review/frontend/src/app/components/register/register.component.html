<div class="auth-container">
    <div class="auth-card card">
        <h2>Join ReviewZone</h2>
        <p class="subtitle">Create an account to leave verified reviews</p>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" [(ngModel)]="name" placeholder="John Doe">
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" [(ngModel)]="email" placeholder="john@example.com">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" [(ngModel)]="password" placeholder="••••••••">
        </div>

        <div class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</div>

        <button class="btn-primary w-100 mt-4" [disabled]="loading" (click)="register()">
            {{ loading ? 'Registering...' : 'Create Account' }}
        </button>

        <div class="auth-footer">
            <span>Already have an account?</span>
            <a routerLink="/login">Login here</a>
        </div>
    </div>
</div>
