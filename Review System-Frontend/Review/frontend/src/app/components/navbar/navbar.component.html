<nav class="navbar">
  <div class="nav-brand" routerLink="/">
    <span class="icon">★</span>
    <span class="brand-text">ReviewZone</span>
  </div>
  <div class="nav-links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
    
    <ng-container *ngIf="auth.isLoggedIn(); else guestLinks">
      <a *ngIf="auth.getUserRole() === 'Admin'" routerLink="/admin" routerLinkActive="active">Admin Panel</a>
      <button class="btn-logout" (click)="logout()">Logout</button>
    </ng-container>

    <ng-template #guestLinks>
      <a routerLink="/login" routerLinkActive="active">Login</a>
      <a routerLink="/register" class="btn-register">Register</a>
    </ng-template>
  </div>
</nav>
